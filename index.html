<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero - Shoe Animation-GSAP</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.6.3/css/font-awesome.css">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <header>
      <span>LOGO.</span>
    </header>

   <section>
    <div class="hero">

      <h1>
        Step Into Style <br> Walk With Confidence.
      </h1>

      <p>
       Discover shoes designed for comfort, durability, and modern style. From everyday sneakers to standout designs, find the perfect pair that supports every step and elevates your look wherever you go.
      </p>

      <button class="btn btn-dropdown">
        <span>Size <i class="fa fa-caret-down" aria-hidden="true"></i></span>
      </button>

      <button class="btn btn-cart">
        <span>Add to cart <i class="fa fa-shopping-cart" aria-hidden="true"></i></span>
      </button>

    </div>

    <figure>
      <img src="./assets/sports.png" alt="">
    </figure>

    <p id="heading">SPORTS</>
   </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.4.0/gsap.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
